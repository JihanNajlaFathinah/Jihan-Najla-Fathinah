<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Belajar PHP | Komika Library</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3A7BD5, #4CB8C4);
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border: 3px solid #000;
      border-radius: 16px;
      box-shadow: 8px 8px 0 #000;
      padding: 32px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    ul {
      padding-left: 20px;
      max-height: 500px;
      overflow-y: auto;
    }

    li {
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📘 Belajar PHP</h1>
    <ul id="list-belajar"></ul>
  </div>

  <script>
    const list = document.getElementById("list-belajar");

    for (let hari = 1; hari <= 1000; hari++) {
      const li = document.createElement("li");
      li.textContent = `Ini adalah hari ke-${hari} belajar PHP`;
      list.appendChild(li);
    }
  </script>

</body>
</html>
