<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Komika Library</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2F6FE4, #5BC6C6);
    }

    .auth-box {
      background: white;
      width: 360px;
      padding: 35px;
      border-radius: 22px;
      border: 3px solid #111;
      box-shadow: 10px 10px 0 #111;
      box-sizing: border-box;
}

    .auth-box h2 {
      text-align: center;
      font-family: 'Comic Neue', cursive;
      margin-bottom: 10px;
    }

    .auth-box p {
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 14px;
      border: 2px solid #111;
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 2px solid #111;
      background: #F5B400;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 4px 4px 0 #111;
    }

    button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0 #111;
    }

    .switch {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .switch span {
      color: #2F6FE4;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .notif {
  margin-top: 12px;
  padding: 10px;
  border-radius: 12px;
  font-size: 14px;
  text-align: center;
  border: 2px solid;
}

.notif.success {
  background: #d4edda;
  color: #155724;
  border-color: #155724;
}

.notif.error {
  background: #f8d7da;
  color: #721c24;
  border-color: #721c24;
}

.notif.warning {
  background: #fff3cd;
  color: #856404;
  border-color: #856404;
}
  </style>
</head>

<body>

<div class="auth-box">

  <!-- LOGIN -->
<div id="loginForm">
  <h2>Login</h2>
  <p>Masuk ke Komika Library</p>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">

  <button onclick="login()">Masuk</button>
  
  <div id="notif" class="notif hidden"></div>

  <div class="switch">
    Belum punya akun?
    <span onclick="showSignup()">Daftar</span>
  </div>
</div>

  <!-- SIGN UP -->
  <div id="signupForm" class="hidden">
    <h2>Sign Up</h2>
    <p>Buat akun baru</p>

    <input type="text" id="fname" placeholder="First Name">
    <input type="text" id="lname" placeholder="Last Name">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="text" id="address" placeholder="Address">
    <input type="password" id="signupPassword" placeholder="Password">

    <button onclick="signup()">Daftar</button>

    <div class="switch">
      Sudah punya akun?
      <span onclick="showLogin()">Login</span>
    </div>
  </div>

</div>

<script>
  function showSignup() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.remove("hidden");
  }

  function showLogin() {
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
  }

  function signup() {
    const fname = document.getElementById("fname").value;
    const lname = document.getElementById("lname").value;
    const email = document.getElementById("signupEmail").value;
    const address = document.getElementById("address").value;
    const password = document.getElementById("signupPassword").value;

    if (!fname || !lname || !email || !address || !password) {
      alert("Semua data wajib diisi!");
      return;
    }

    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPassword", password);
    localStorage.setItem("fullname", fname + " " + lname);
    localStorage.setItem("address", address);

    alert("Akun berhasil dibuat. Silakan login.");
    showLogin();
  }

function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const savedEmail = localStorage.getItem("userEmail");
  const savedPassword = localStorage.getItem("userPassword");

  const notif = document.getElementById("notif");

  notif.classList.remove("hidden", "success", "error", "warning");

 
  if (email === "" || password === "") {
    notif.classList.add("warning");
    notif.innerText = "Input belum lengkap!";
  }
 
  else if (email === savedEmail && password === savedPassword) {
    notif.classList.add("success");
    notif.innerText = "Login berhasil!";
    localStorage.setItem("login", "true");

    setTimeout(() => {
      window.open("index.html", "_blank");
    }, 1000);
  }

  else {
    notif.classList.add("error");
    notif.innerText = "Email atau password salah!";
  }
}

</script>

</body>
</html>
